name: Docs

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_RUNS_ON || '"ubuntu-22.04"') || 'ubuntu-22.04' }}
    env:
      JAX_ENABLE_X64: "True"
      JAX_DISABLE_JIT: "1"
      DKX_SOLVER_JIT: "0"
      DKX_PRECOMPILE: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tool cache for self-hosted runners
        if: runner.environment == 'self-hosted'
        run: echo "AGENT_TOOLSDIRECTORY=$RUNNER_TOOL_CACHE" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
          enable-cache: false
          activate-environment: true
          venv-path: ${{ runner.temp }}/venv
      - name: Install
        run: |
          uv pip install -e ".[docs]"
      - name: Build docs
        run: |
          sphinx-build -W -b html docs docs/_build/html
