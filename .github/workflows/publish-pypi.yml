name: Publish PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate release metadata
        run: |
          python - <<'PY'
          import ast
          import os
          from pathlib import Path

          tree = ast.parse(Path("dkx/_version.py").read_text())
          assignments = [
              node for node in tree.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets)
          ]
          if len(assignments) != 1:
              raise SystemExit("dkx/_version.py must contain exactly one __version__ assignment")
          version = ast.literal_eval(assignments[0].value)
          if not isinstance(version, str) or not version:
              raise SystemExit("dkx.__version__ must be a non-empty string literal")

          ref_type = os.environ.get("GITHUB_REF_TYPE", "")
          ref_name = os.environ.get("GITHUB_REF_NAME", "")
          if ref_type == "tag" and ref_name != f"v{version}":
              raise SystemExit(f"Tag {ref_name!r} does not match package version v{version}")
          print(f"validated package version {version}")
          PY
      - name: Build distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
