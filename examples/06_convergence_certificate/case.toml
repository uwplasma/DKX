# The case rung 06 refines. Deliberately under-resolved: the point of the rung
# is to measure how far off it is, not to be right.
schema = 1
name = "convergence_certificate"

[run]
workflow = "profile"
progress = false

[geometry]
format = "analytic"
file = "tokamak"
surfaces = [0.16, 0.25]

[[species]]
name = "deuterium"
charge = 1
mass_amu = 2.014
density_m3 = [8.0e19, 7.0e19]
temperature_keV = [1.0, 0.8]

[physics]
model = "full_local"
collisions = "pitch_angle_scattering"
magnetic_drifts = "dkes"
phi1 = "off"

[electric_field]
mode = "prescribed"
value_kV_m = 0.0

[resolution]
theta = 9
zeta = 1
pitch = 8
speed = 4

[solver]
method = "auto"
relative_tolerance = 1.0e-8
memory_fraction = 0.75
reuse = "auto"

[output]
file = "convergence_certificate.nc"
plots = true
