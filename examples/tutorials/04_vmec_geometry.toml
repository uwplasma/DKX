# Tutorial 04: a VMEC equilibrium as the geometry.  Point `file` at your own
# wout_*.nc; relative paths resolve beside this file, not the shell's cwd.
# Run with:  dkx run examples/tutorials/04_vmec_geometry.toml --out result.nc
name = "vmec_geometry"

[run]
workflow = "profile"
progress = true

[geometry]
format = "vmec"
# A two-field-period stellarator (the unoptimized seed of a VMEX QA
# optimization), shipped compressed; the script decompresses it once.
file = "../../tests/ref/wout_vmex_seed_nfp2_ns13.nc"
surfaces = [0.25, 0.36, 0.49]

[[species]]
name = "deuterium"
charge = 1
mass_amu = 2.014
density_m3 = [8.0e19, 7.0e19, 5.8e19]
temperature_keV = [1.0, 0.8, 0.6]

[physics]
collisions = "pitch_angle_scattering"

[electric_field]
mode = "prescribed"
value_kV_m = 0.0

[resolution]
# A stellarator field varies along zeta as well as theta, so both are resolved.
theta = 13
zeta = 13
pitch = 16
speed = 5

[solver]
method = "auto"
