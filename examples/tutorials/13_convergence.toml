# The case the convergence tutorial refines. A dense, cold edge-like deuterium
# plasma (plateau/Pfirsch-Schlueter side of the banana regime), where the
# distribution is smooth and a modest grid converges. The grid below is
# deliberately coarse: the point is to measure how far off it is, then climb.
name = "convergence_certificate"

[run]
workflow = "profile"
progress = false

[geometry]
format = "analytic"
file = "tokamak"
surfaces = [0.16, 0.25]

[[species]]
name = "deuterium"
charge = 1
mass_amu = 2.014
density_m3 = [2.0e20, 1.75e20]
temperature_keV = [0.2, 0.16]

[physics]
model = "full_local"
collisions = "pitch_angle_scattering"
magnetic_drifts = "dkes"
phi1 = "off"

[electric_field]
mode = "prescribed"
value_kV_m = 0.0

[resolution]
theta = 9
zeta = 1
pitch = 8
speed = 4

[solver]
method = "auto"
relative_tolerance = 1.0e-8
memory_fraction = 0.75
reuse = "auto"

[output]
file = "convergence_certificate.nc"
plots = true
