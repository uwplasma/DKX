[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dkx"
version = "2.2.0"
description = "Neoclassical transport solver with CPU/GPU and differentiable JAX workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  # numpy>=2.1 is not a new constraint -- it is the one jax already carries,
  # made explicit so the resolver says so.  Left implicit, `pip install dkx`
  # into an environment holding a conda-managed numpy 1.x resolves happily and
  # then dies at import with `NameError: name 'isnan' is not defined` from
  # inside numpy.core.getlimits, raised while ml_dtypes probes bfloat16's
  # finfo.  That traceback names neither dkx nor the real problem.  A clean
  # venv always resolves correctly, which is why CI never saw it.
  "jax",
  "numpy>=2.1",
  "scipy",
  "h5py",
  "netCDF4",
  "matplotlib",
  # solvax (PyPI) owns the structured linear-algebra solver tiers (block-Thomas
  # elimination, recycled GCROT, implicit differentiation) that every canonical
  # solve uses; it is a core dependency, not optional.  0.13.0 is the floor:
  # the tier-2 coarse preconditioner's reusable Schur-LU-only route needs
  # block_thomas_factor_fn(..., store_offdiagonals=False), which is new there.
  "solvax>=0.13.0",
]

[project.optional-dependencies]
# Retained as a no-op alias so existing `pip install dkx[structured]`
# invocations keep working; solvax is now a core dependency (see above).
structured = [
  "solvax>=0.13.0",
]
dev = [
  "pytest",
  "pytest-cov",
  "pytest-xdist",
  "pytest-split",
  # Read back the multi-page PDF that dkx.plot writes, so the page count is a
  # measurement rather than a claim (tests/test_plot_pdf_paging_*).
  "pypdf",
]
docs = [
  "sphinx",
  "sphinx-rtd-theme",
]

[project.urls]
Homepage = "https://github.com/uwplasma/DKX"
Documentation = "https://sfincs-jax.readthedocs.io/"
Repository = "https://github.com/uwplasma/DKX"
Issues = "https://github.com/uwplasma/DKX/issues"

[project.scripts]
dkx = "dkx.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dkx*"]

[tool.setuptools.package-data]
dkx = ["validation/*.json"]

[tool.pytest.ini_options]
addopts = ["--import-mode=prepend"]
testpaths = ["tests"]
markers = [
  "slow: heavy end-to-end example/optimization tests; excluded from the fast coverage shards via -m 'not slow' (still run in the full local suite).",
]

