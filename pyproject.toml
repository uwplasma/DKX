[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dkx"
dynamic = ["version"]
description = "Neoclassical transport solver with CPU/GPU and differentiable JAX workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  # numpy>=2.1 is not a new constraint -- it is the one jax already carries,
  # made explicit so the resolver says so.  Left implicit, `pip install dkx`
  # into an environment holding a conda-managed numpy 1.x resolves happily and
  # then dies at import with `NameError: name 'isnan' is not defined` from
  # inside numpy.core.getlimits, raised while ml_dtypes probes bfloat16's
  # finfo.  That traceback names neither dkx nor the real problem.  A clean
  # venv always resolves correctly, which is why CI never saw it.
  "jax",
  "numpy>=2.1",
  "scipy",
  "h5py",
  "netCDF4",
  "matplotlib",
  # Rich owns every user-facing table, progress bar, and error panel the CLI
  # prints. It is a core dependency, not an extra: `dkx run` without it would
  # have to carry a second, plainer output path, and two formatters drift.
  "rich>=13.0",
  # solvax (PyPI) owns the structured linear-algebra solver routes (block-Thomas
  # elimination, recycled GCROT, implicit differentiation) that every canonical
  # solve uses; it is a core dependency, not optional. 0.24.0 is the floor:
  # `solvax.equilibration` scales the assembled operator before it is factored,
  # without which a factorization picks its pivots from rows carrying streaming,
  # collision and constraint terms at once. 0.23.0 added `solvax.compression`,
  # which recovers a sparse matrix from products with a known pattern and is how
  # `dkx.assembly` forms the operator at all -- sampling one column per product
  # costs 633,604 products on the deck that motivated it.
  # 0.21.0 was the previous floor: its bordered preconditioner applies the coarse
  # inverse once per Krylov iteration instead of twice (SOLVAX #101), and every
  # published DKX Krylov timing since 2026-09-12 was measured with that
  # behaviour.
  "solvax>=0.24.0",
]

[project.optional-dependencies]
# `structured` is gone. It was an alias for a dependency that has been core
# since solvax moved into the required list, so installing it changed nothing;
# pip warns about the unknown extra and installs the same environment.
dev = [
  "pytest",
  "pytest-cov",
  "pytest-xdist",
  "pytest-split",
  # Read back the multi-page PDF that dkx.plot writes, so the page count is a
  # measurement rather than a claim (tests/test_plot_pdf_paging_*).
  "pypdf",
]
docs = [
  "sphinx",
  "myst-parser",
  "furo",
]

[project.urls]
Homepage = "https://github.com/uwplasma/DKX"
Documentation = "https://sfincs-jax.readthedocs.io/"
Repository = "https://github.com/uwplasma/DKX"
Issues = "https://github.com/uwplasma/DKX/issues"

[project.scripts]
dkx = "dkx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dkx*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
dkx = ["validation/*.json"]

[tool.setuptools.dynamic]
version = {attr = "dkx._version.__version__"}

# The coverage shards install the package non-editable, so they record paths
# under site-packages, while the report job only checks the repository out.
# Without this mapping `coverage combine` keeps the site-packages paths and the
# report fails with "No source for code". Listing both tells coverage they are
# the same code and rewrites the shard data onto the checkout.
[tool.coverage.paths]
source = [
  "src/dkx",
  "*/site-packages/dkx",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=prepend"]
testpaths = ["tests"]
markers = [
  "slow: heavy end-to-end example/optimization tests; excluded from the fast coverage shards via -m 'not slow' (still run in the full local suite).",
]
