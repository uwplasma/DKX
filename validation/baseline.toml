[[known_gap]]
id = "GAP-A-002"
phase = "A"
description = "Branch protection on main declares no required status checks and no required reviews. Twenty-one green checks on the audited commit are advisory. plan.md section 3.4 requires this to be verified and enforced."

[[known_gap]]
id = "GAP-A-003"
phase = "A"
description = "A fresh clone from origin is 36.46 MiB against the 20 MiB target. The Git object store alone is 22.35 MiB, so no working-tree reduction can close the gap; only an explicitly approved history rewrite can, and that is Phase I work."

[[known_gap]]
id = "GAP-A-004"
phase = "A"
status = "closed"
description = "The Phase A audit reported three summaries with no named generator. Two of them, full_kinetic_sfincs_finite_er_v1.json and full_kinetic_sfincs_stellarator_v1.json, were a false positive: the shared audit_full_kinetic_sfincs_validation.py audits all three full-kinetic artifacts and is invoked with --artifact, so a filename grep did not see it. Only w7x_admitted_grid_uniform_probe_no_go_v1.json truly had none. Phase B added audit_w7x_admitted_grid_uniform_probe_no_go.py and validation/registry.toml now records a command for every entry."

[[known_gap]]
id = "GAP-A-005"
phase = "A"
description = "validation/capabilities.toml still carries baseline_commit c003ba8e from 2026-08-28 and does not name every capability tracked by plan.md section 12. Phase B rebuilds the registry rather than patching it here."

[[known_gap]]
id = "GAP-A-006"
phase = "A"
status = "partly_closed"
description = "Published performance claims in README.md, docs/performance.rst, docs/index.rst, docs/differentiability.rst, and docs/release_notes.rst cite a MacBook with an Apple M4, about 10 cores and 24 GB. Phase B identified that host from the artifacts' own environment blocks and registered it as campaign-mac-mini-m4: a Mac mini Mac16,10, not a MacBook. The registry now names it per entry. What remains open is the docs prose, which still calls it a MacBook, and the fact that no performance number has been re-measured on official-laptop-cpu."
