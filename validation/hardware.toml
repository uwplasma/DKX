notes = "Observed directly on 2026-08-30; earlier audits recorded it as unreachable. A GPU lane is blocked on the interpreter, not on the hardware: the only Python present is the system 3.10.12, and DKX now requires >=3.11. There is no conda, pyenv or uv on the box, and the existing stellarator_venv runs jax 0.6.2 with both CUDA devices visible. Standing up a GPU lane means installing a 3.11+ toolchain into the user home first; that is a change to a shared lab workstation and needs the maintainer to agree before anyone does it."

