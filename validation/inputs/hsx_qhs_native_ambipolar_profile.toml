# HSX QHS ambipolar profile, PAS/DKES collisions. Profiles are linear in the normalised toroidal flux s:
#   n(s)  = 8.0e18 (1 - 0.6 s) m^-3, equal for both species
#   Te(s) = 0.5 (1 - s) keV, Ti(s) = 0.1 (1 - 0.6 s) keV
# They are representative of ECRH-heated HSX plasmas and are not fitted to a discharge.
schema = 1
name = "hsx_qhs_native_ambipolar_profile"

[run]
workflow = "ambipolar_profile"
precision = "float64"
device = "cpu"

[geometry]
format = "vmec"
file = "wout_HSX.nc"
surfaces = [0.09, 0.16, 0.25, 0.36, 0.49]

[[species]]
name = "hydrogen"
charge = 1
mass_amu = 1.007276
density_m3 = [7.568e18, 7.232e18, 6.8e18, 6.272e18, 5.648e18]
temperature_keV = [0.0946, 0.0904, 0.085, 0.0784, 0.0706]

[[species]]
name = "electron"
charge = -1
mass_amu = 5.485799e-4
density_m3 = [7.568e18, 7.232e18, 6.8e18, 6.272e18, 5.648e18]
temperature_keV = [0.455, 0.42, 0.375, 0.32, 0.255]

[physics]
model = "full_local"
collisions = "pitch_angle_scattering"
magnetic_drifts = "dkes"
phi1 = "off"

[electric_field]
mode = "ambipolar"
search_kV_m = [-20.0, 20.0]
find_all_roots = true
continue_branches = true
search_points = 17
root_tolerance_kV_m = 0.005
max_root_iterations = 15

[resolution]
theta = 11
zeta = 25
pitch = 40
speed = 6

[solver]
method = "auto"
relative_tolerance = 1.0e-9
memory_fraction = 0.75
reuse = "auto"

[convergence]
enabled = false
observables = ["particle_flux", "heat_flux", "electric_field"]
relative_tolerance = 0.02
max_refinements = 1

[output]
plots = false
