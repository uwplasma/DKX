schema = 1
name = "w7x_admitted_grid_seeded_extension"

[run]
workflow = "ambipolar_profile"
precision = "float64"
device = "cpu"
progress = true

[geometry]
format = "boozer"
file = "w7x_standardConfig.bc"
surfaces = [0.16, 0.25]

[[species]]
name = "hydrogen"
charge = 1
mass_amu = 1.007276
density_m3 = [1.49e19, 1.44e19]
temperature_keV = [1.05, 0.95]

[[species]]
name = "electron"
charge = -1
mass_amu = 5.485799e-4
density_m3 = [1.49e19, 1.44e19]
temperature_keV = [3.60, 2.50]

[physics]
model = "full_local"
collisions = "pitch_angle_scattering"
magnetic_drifts = "dkes"
phi1 = "off"

[electric_field]
mode = "ambipolar"
search_kV_m = [-2.0, 14.0]
search_strategy = "seeded_brackets"
seed_brackets_kV_m = [
  [[12.671875, 12.681640625]],
  [[11.0, 14.0]],
]
find_all_roots = true
continue_branches = true
search_points = 17
root_tolerance_kV_m = 0.01
max_root_iterations = 12

[resolution]
theta = 15
zeta = 85
pitch = 150
speed = 8

[solver]
method = "auto"
relative_tolerance = 1.0e-9
memory_fraction = 0.10
reuse = "auto"

[parallel]
strategy = "auto"

[convergence]
enabled = false

[output]
file = "w7x-admitted-grid-seeded-extension.nc"
plots = false
