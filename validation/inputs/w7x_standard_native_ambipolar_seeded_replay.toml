schema = 1
name = "w7x_seeded_bracket_discovery_replay"

[run]
workflow = "ambipolar_profile"
precision = "float64"
device = "cpu"
progress = true

[geometry]
format = "boozer"
file = "w7x_standardConfig.bc"
surfaces = [0.16, 0.25]

[[species]]
name = "hydrogen"
charge = 1
mass_amu = 1.007276
density_m3 = [1.49e19, 1.44e19]
temperature_keV = [1.05, 0.95]

[[species]]
name = "electron"
charge = -1
mass_amu = 5.485799e-4
density_m3 = [1.49e19, 1.44e19]
temperature_keV = [3.60, 2.50]

[physics]
model = "full_local"
collisions = "pitch_angle_scattering"
magnetic_drifts = "dkes"
phi1 = "off"

[electric_field]
mode = "ambipolar"
search_kV_m = [-20.0, 20.0]
search_strategy = "seeded_brackets"
seed_brackets_kV_m = [
  [[11.455078125, 11.4599609375]],
  [[-0.1025390625, -0.09765625], [0.1806640625, 0.185546875], [8.427734375, 8.4326171875]],
]
find_all_roots = true
continue_branches = true
search_points = 17
root_tolerance_kV_m = 0.005
max_root_iterations = 15

[resolution]
theta = 15
zeta = 37
pitch = 36
speed = 6

[solver]
method = "auto"
relative_tolerance = 1.0e-9
memory_fraction = 0.75
reuse = "auto"

[parallel]
strategy = "auto"

[convergence]
enabled = false

[output]
file = "w7x-seeded-bracket-replay.nc"
plots = false
