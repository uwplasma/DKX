schema_version = 1
limit_bytes = 20971520

[measurements.tracked_worktree]
enforced = true
description = "Tracked working-tree files; diagnostic component of a full clone."

[measurements.tracked_media]
enforced = true
description = "Tracked raster, vector, and PDF media across the repository."

[measurements.wheel]
enforced = true
description = "The built DKX wheel."

[measurements.sdist]
enforced = true
description = "The built DKX source distribution."

[measurements.installed]
enforced = true
description = "DKX package and dist-info files after a clean wheel install, including bytecode caches."

[measurements.full_clone]
enforced = false
description = "Fresh full clone including working tree and Git object store."
blocker = "Measured on a fresh clone 2026-09-01: 29.32 MiB total -- 14.49 MiB tracked working tree plus a 14.83 MiB object store. Both clauses of the previous blocker are now false. The object store is under 20 MiB, not over it, and a further history rewrite cannot enable this gate: the tracked tree alone is 14.49 MiB, so even a zero-byte history leaves only 5.51 MiB of headroom. Closing this needs the tracked tree to shrink, or the 20 MiB full-clone target to be restated as a per-measurement budget rather than one number applied to a sum of two."
