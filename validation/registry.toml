# DKX 3 validation registry.
#
# One entry per registered evidence artifact. plan.md section 7.8 makes this file
# the single place that binds a claim to its capability, its inputs, its
# generating command, the artifact it produced, and the limits of what the
# artifact establishes. `dkx.validation.registry` is the one generic runner that
# checks every entry; tests/test_validation.py is the one test module that
# consumes it. Do not add a per-campaign registry, runner, or test module.
#
# status vocabulary
#   accepted          the claim passes its declared gates and is usable evidence
#   accepted_limited  the claim passes inside an explicitly narrower scope
#   diagnostic        the run localizes or bounds a problem without admitting a claim
#   negative_result   the run rules a route or resolution out; kept so it is not retried
#
# `capability` must name an entry in capabilities.toml. `claim_scope` must equal
# the artifact's own claim_scope. `limitations` must equal the artifact's own
# exclusions. `artifact_sha256` seals the artifact against silent edits.

schema_version = 1
recorded_at = "2026-08-30"
registry_commit = "835dfddfea6348c9ff03610afcb36c9fd664c876"
status_values = ["accepted", "accepted_limited", "diagnostic", "negative_result"]

